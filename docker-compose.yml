x-worker-environment: &worker-environment
  <<: *app-environment
  WORKER_ID: ${WORKER_ID:-dialogy-worker}

x-worker-ai-environment: &worker-ai-environment
  <<: *app-environment
  AI_WORKER_ID: ${AI_WORKER_ID:-dialogy-worker-ai}

services:
  dialogy:
    image: fafadexs/dialogy:PBE-5.105
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
    ports:
      - "9045:9045"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9045/api/build-id').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      timeout: 5s
      interval: 30s
      retries: 5
      start_period: 40s
    stop_grace_period: 30s

  worker:
    image: fafadexs/dialogy-worker:PBE-5.105
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *worker-environment
    stop_grace_period: 30s

  worker-ai:
    image: fafadexs/dialogy-worker-ai:PBE-5.105
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *worker-ai-environment
    stop_grace_period: 30s
