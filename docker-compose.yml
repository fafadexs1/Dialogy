  <<: *app-environment
  WORKER_ID: ${WORKER_ID:-dialogy-worker}

x-worker-ai-environment: &worker-ai-environment
  <<: *app-environment
  AI_WORKER_ID: ${AI_WORKER_ID:-dialogy-worker-ai}

x-worker-campaign-environment: &worker-campaign-environment
  <<: *app-environment
  CAMPAIGN_WORKER_ID: ${CAMPAIGN_WORKER_ID:-dialogy-worker-campaign}
  CAMPAIGN_WORKER_CONCURRENCY: ${CAMPAIGN_WORKER_CONCURRENCY:-2}
  CAMPAIGN_WORKER_POLL_MS: ${CAMPAIGN_WORKER_POLL_MS:-1000}
  CAMPAIGN_WORKER_LOCK_MS: ${CAMPAIGN_WORKER_LOCK_MS:-600000}

services:
  # Docker creates named volumes as root. The application images deliberately run
  # as uid 1001, so initialise the shared Hugging Face/ONNX cache before either
  # process can load a local embedding or reranking model.
  ai-cache-init:
    image: fafadexs/dialogy-worker-ai:PDC-1.99
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /tmp/dialogy-transformers-cache
        chown -R 1001:1001 /tmp/dialogy-transformers-cache
        chmod -R u+rwX,go-rwx /tmp/dialogy-transformers-cache
    volumes:
      - dialogy-transformers-cache:/tmp/dialogy-transformers-cache

  dialogy:
    image: fafadexs/dialogy:PDC-1.99
    restart: unless-stopped
    init: true
    depends_on:
      ai-cache-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      # Orcamento de conexoes: o Postgres tem max_connections=100 e o Supabase
      # self-hosted ja consome ~45, deixando ~41 livres. A soma dos 7 servicos
      # com acesso ao banco da 36, preservando folga para migrations e diagnostico.
      DB_POOL_MAX: ${DIALOGY_DB_POOL_MAX:-15}
    volumes:
      - dialogy-transformers-cache:/tmp/dialogy-transformers-cache
    ports:
      - "${PORT:-9045}:${PORT:-9045}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||'9045')+'/api/build-id').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      timeout: 5s
      interval: 30s
      retries: 5
      start_period: 40s
    networks: [default, supabase]
    stop_grace_period: 30s

  worker:
    image: fafadexs/dialogy-worker:PDC-1.99
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *worker-environment
      # QUEUE_WORKER_CONCURRENCY=8 — o pool nao precisa passar disso.
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-8}
      # O agendador Nexus pertence ao servico dialogy-nexus neste stack.
      NEXUS_SCHEDULE_ENABLED: "false"
    networks: [default, supabase]
    stop_grace_period: 30s

  worker-ai:
    image: fafadexs/dialogy-worker-ai:PDC-1.99
    restart: unless-stopped
    init: true
    depends_on:
      ai-cache-init:
        condition: service_completed_successfully
      dialogy:
        condition: service_healthy
    environment:
      <<: *worker-ai-environment
      # AI_QUEUE_WORKER_CONCURRENCY=2.
      DB_POOL_MAX: ${WORKER_AI_DB_POOL_MAX:-3}
    volumes:
      - dialogy-transformers-cache:/tmp/dialogy-transformers-cache
    networks: [default, supabase]
    stop_grace_period: 30s

  worker-campaign:
    image: fafadexs/dialogy-worker:PDC-1.99
    command: ["node", "dist/worker-campaign.js"]
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *worker-campaign-environment
      # CAMPAIGN_WORKER_CONCURRENCY=2.
      DB_POOL_MAX: ${WORKER_CAMPAIGN_DB_POOL_MAX:-3}
    networks: [default, supabase]
    stop_grace_period: 30s

  worker-meta-relay:
    image: fafadexs/dialogy-worker:PDC-1.99
    command: ["node", "dist/worker-meta-relay.js"]
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *app-environment
      # META_RELAY_CONCURRENCY=5.
      DB_POOL_MAX: ${WORKER_META_RELAY_DB_POOL_MAX:-4}
    networks: [default, supabase]
    stop_grace_period: 30s

  worker-google-ads:
    image: fafadexs/dialogy-worker:PDC-1.99
    command: ["node", "dist/worker-google-ads.js"]
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *app-environment
      # Fila de conversoes offline: baixo volume, pool pequeno basta.
      DB_POOL_MAX: ${WORKER_GOOGLE_ADS_DB_POOL_MAX:-2}
    networks: [default, supabase]
    stop_grace_period: 30s

  # Nexus continua sendo codigo nativo da Dialogy. Este processo dedicado
  # executa somente os gatilhos agendados e publica saude/metricas operacionais;
  # mensagens e webhooks seguem no runtime principal, sem consumo duplicado.
  dialogy-nexus:
    image: fafadexs/dialogy-worker:PDC-1.99
    command: ["node", "dist/worker-nexus.js"]
    restart: unless-stopped
    init: true
    depends_on:
      dialogy:
        condition: service_healthy
    environment:
      <<: *app-environment
      # Consultas e execucoes agendadas sao seriais neste processo; uma conexao
      # basta e preserva folga no Postgres para o app e os workers de mensagens.
      DB_POOL_MAX: ${NEXUS_DB_POOL_MAX:-1}
      NEXUS_SCHEDULE_ENABLED: ${NEXUS_SCHEDULE_ENABLED:-true}
      NEXUS_MONITOR_PORT: 9050
    ports:
      - "127.0.0.1:${NEXUS_MONITOR_PORT:-9050}:9050"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9050/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      timeout: 5s
      interval: 30s
      retries: 5
      start_period: 20s
    networks: [default, supabase]
    stop_grace_period: 30s

volumes:
  dialogy-transformers-cache:

networks:
  # Rede interna do proprio stack.
  default:
  # Rede da stack Supabase, para alcancar o Supavisor pelo nome do servico.
  # Com isto o DATABASE_URL passa a ser:
  #   postgresql://postgres.dialogy:SENHA@supavisor:6543/postgres
  # Repare na porta 6543 — a interna do container. A 6547 e a publicacao no
  # host, que deixa de ser necessaria e deveria ser fechada.
  supabase:
    external: true
    name: dialogy_supabase_default
